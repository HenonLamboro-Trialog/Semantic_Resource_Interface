schema_name: raiprogramming_meter

# Ontology-conformant mapping for a raiprogramming electricity meter snapshot
# (e.g. EE_METER_ISKRA_AM550), produced by adapters/raiprogramming/source.py.
#
# Every term below is defined in RESONANCE-Ontology (verified by
# tools.mapping_linter). Only power quantities are mapped: the ontology has no
# Voltage / Current / Energy measurement classes yet, so those sensors are left
# out on purpose (see docs/ontology-conformance-gap-report.md).

prefixes:
  sri4all: "https://w3id.org/resonance/SRI4ALL#"
  saref: "https://saref.etsi.org/core/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  unit: "http://qudt.org/vocab/unit/"

# Lets AUTO-DETECT pick this mapping for meter snapshots.
match:
  required_fields:
    - resource_id
    - active_power.value

# The meter is a power device that measures power.
resource:
  id_path: resource_id
  class:
    prefix: sri4all
    name: PowerDevice

measurements:
  # Active power -> PowerMeasurement with an ActivePower power property.
  - path: active_power.value
    class:
      prefix: sri4all
      name: PowerMeasurement
    relation:
      prefix: sri4all
      name: measuresPower
    value_predicate:
      prefix: sri4all
      name: powerValue
    datatype: float

    unit_path: active_power.unit
    unit_prefix: unit
    unit_predicate:
      prefix: sri4all
      name: isMeasuredIn

    timestamp_path: timestamp
    timestamp_datatype: dateTime
    timestamp_predicate:
      prefix: sri4all
      name: timestamp

    property:
      prefix: sri4all
      name: ActivePower
    property_relation:
      prefix: sri4all
      name: hasPowerProperty

  # Reactive power -> PowerMeasurement with a ReactivePower power property.
  - path: reactive_power.value
    class:
      prefix: sri4all
      name: PowerMeasurement
    relation:
      prefix: sri4all
      name: measuresPower
    value_predicate:
      prefix: sri4all
      name: powerValue
    datatype: float

    unit_path: reactive_power.unit
    unit_prefix: unit
    unit_predicate:
      prefix: sri4all
      name: isMeasuredIn

    timestamp_path: timestamp
    timestamp_datatype: dateTime
    timestamp_predicate:
      prefix: sri4all
      name: timestamp

    property:
      prefix: sri4all
      name: ReactivePower
    property_relation:
      prefix: sri4all
      name: hasPowerProperty
